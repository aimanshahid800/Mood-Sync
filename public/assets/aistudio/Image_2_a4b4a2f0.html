<!DOCTYPE html><html lang="en" style=""><head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MoodSync - New Task</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            quicksand: ['Quicksand', 'sans-serif'],
          },
          colors: {
            candy: '#E78299',
            heather: '#877499',
            viridian: '#679F9F',
            sandstone: '#E6D4BF',
            azur: '#7D97C9',
            cream: '#FFFDF9',
            warmdark: '#3D343A',
            muteddark: '#71626A',
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Quicksand', sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }
    .shadow-cozy {
      box-shadow: 0 10px 25px -4px rgba(135, 116, 153, 0.22), 0 6px 14px -3px rgba(231, 130, 153, 0.18);
    }
    .shadow-card {
      box-shadow: 0 16px 36px -8px rgba(90, 52, 65, 0.16);
    }
    .shadow-nav {
      box-shadow: 0 14px 34px -4px rgba(90, 52, 65, 0.22);
    }
    .shadow-raised {
      box-shadow: 0 10px 20px -3px rgba(135, 116, 153, 0.45);
    }
  </style>
</head>
<body class="bg-[#E78299] w-[390px] min-h-[844px] h-[844px] relative overflow-hidden flex flex-col justify-between text-warmdark">

  <!-- Subtle warm ambient shapes (solid, cozy, no glass/blur) -->
  <div class="absolute -top-12 -right-10 w-44 h-44 rounded-full bg-[#f095ab] opacity-50 pointer-events-none"></div>
  <div class="absolute top-44 -left-12 w-32 h-32 rounded-full bg-[#de7289] opacity-40 pointer-events-none"></div>
  <div class="absolute bottom-28 -right-8 w-36 h-36 rounded-full bg-[#f39cb0] opacity-45 pointer-events-none"></div>
  <div class="absolute top-24 right-8 w-3 h-3 rounded-full bg-cream opacity-60 pointer-events-none"></div>
  <div class="absolute top-36 left-6 w-2.5 h-2.5 rounded-full bg-sandstone opacity-70 pointer-events-none"></div>

  <!-- iOS Status Bar -->
  <div class="w-full pt-3 px-7 flex justify-between items-center z-20 text-white font-semibold text-xs tracking-wider">
    <span class="">9:41</span>
    <div class="flex items-center space-x-1.5">
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.28 19.58 10.58 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"></path></svg>
      <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4z"></path></svg>
      <div class="w-5 h-2.5 border-2 border-white rounded-sm p-0.5 flex items-center">
        <div class="w-full h-full bg-white rounded-xs"></div>
      </div>
    </div>
  </div>

  <!-- Top App Bar / Header -->
  <header class="px-6 pt-2 pb-3 flex items-center justify-between z-20">
    <button class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white">
      <svg class="w-5 h-5 stroke-current fill-none stroke-[2.5]" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>
    <h1 class="text-2xl font-extrabold text-white tracking-tight">New Task</h1>
    <div class="w-10 h-10 rounded-full bg-white/20 hover:bg-white/30 active:scale-95 transition-all flex items-center justify-center text-white">
      <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="2"></circle>
        <circle cx="6" cy="12" r="2"></circle>
        <circle cx="18" cy="12" r="2"></circle>
      </svg>
    </div>
  </header>

  <!-- Main Content Card Container (Scrollable if needed, fits screen) -->
  <main class="flex-1 px-5 pb-24 z-10 overflow-y-auto no-scrollbar flex flex-col justify-start">
    <!-- Solid Cream Rounded Form Card -->
    <div class="bg-cream rounded-[32px] p-5 shadow-card flex flex-col gap-4 border border-[#fff1f4]">

      <!-- Task Name Input Field -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-muteddark tracking-wide uppercase px-1">Task Name</label>
        <div class="bg-[#FFF5F7] border-2 border-[#FBD6DF] rounded-full px-4 py-3 flex items-center gap-2.5 transition-all focus-within:border-candy focus-within:bg-white">
          <svg class="w-5 h-5 text-candy flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
          </svg>
          <input type="text" value="Gentle Mindful Yoga" placeholder="What would you like to do?" class="bg-transparent w-full text-warmdark placeholder-muteddark/50 text-sm font-bold focus:outline-none">
        </div>
      </div>

      <!-- Date & Time Picker Pill -->
      <div class="flex flex-col gap-1.5">
        <label class="text-xs font-bold text-muteddark tracking-wide uppercase px-1">Scheduled Time</label>
        <div class="grid grid-cols-2 gap-2.5">
          <!-- Date Pill -->
          <div class="bg-[#FFF5F7] border-2 border-[#FBD6DF] rounded-full px-3.5 py-2.5 flex items-center justify-between cursor-pointer hover:border-candy transition-all">
            <div class="flex items-center gap-2 min-w-0">
              <svg class="w-4 h-4 text-heather flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                <rect x="3" y="4" width="18" height="18" rx="3"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
              <span class="text-xs font-bold text-warmdark truncate">Today, Oct 24</span>
            </div>
            <svg class="w-3.5 h-3.5 text-muteddark" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </div>
          <!-- Time Pill -->
          <div class="bg-[#FFF5F7] border-2 border-[#FBD6DF] rounded-full px-3.5 py-2.5 flex items-center justify-between cursor-pointer hover:border-candy transition-all">
            <div class="flex items-center gap-2 min-w-0">
              <svg class="w-4 h-4 text-heather flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2">
                <circle cx="12" cy="12" r="9"></circle>
                <polyline points="12 7 12 12 15 15"></polyline>
              </svg>
              <span class="text-xs font-bold text-warmdark truncate">4:00 PM</span>
            </div>
            <svg class="w-3.5 h-3.5 text-muteddark" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"></path>
            </svg>
          </div>
        </div>
      </div>

      <!-- Priority Selector (3 Chunky Rounded Chips) -->
      <div class="flex flex-col gap-1.5">
        <div class="flex justify-between items-center px-1">
          <label class="text-xs font-bold text-muteddark tracking-wide uppercase">Energy &amp; Priority</label>
          <span class="text-[11px] font-semibold text-heather">Medium Effort</span>
        </div>
        <div class="grid grid-cols-3 gap-2">
          <!-- Low Chip -->
          <button type="button" class="py-2.5 px-3 rounded-2xl bg-[#FFF5F7] border-2 border-[#FBD6DF] hover:border-viridian text-muteddark font-bold text-xs flex flex-col items-center justify-center gap-0.5 active:scale-95 transition-all">
            <span class="text-sm">🌱</span>
            <span class="">Low</span>
          </button>
          <!-- Medium Chip (Active) -->
          <button type="button" class="py-2.5 px-3 rounded-2xl bg-candy text-white font-extrabold text-xs flex flex-col items-center justify-center gap-0.5 shadow-sm active:scale-95 transition-all border-2 border-candy">
            <span class="text-sm">✨</span>
            <span class="">Medium</span>
          </button>
          <!-- High Chip -->
          <button type="button" class="py-2.5 px-3 rounded-2xl bg-[#FFF5F7] border-2 border-[#FBD6DF] hover:border-heather text-muteddark font-bold text-xs flex flex-col items-center justify-center gap-0.5 active:scale-95 transition-all">
            <span class="text-sm">🔥</span>
            <span class="">High</span>
          </button>
        </div>
      </div>

      <!-- Highlighted AI Suggestion Box in Solid Sandstone -->
      <div class="bg-sandstone rounded-2xl p-3.5 flex items-start gap-3 border border-[#d9c4ad] text-warmdark relative">
        <div class="w-8 h-8 rounded-full bg-white flex items-center justify-center flex-shrink-0 text-heather shadow-sm">
          <!-- Sparkle Icon -->
          <svg class="w-4 h-4 fill-current text-heather" viewBox="0 0 24 24">
            <path d="M12 2L14.2 9.8L22 12L14.2 14.2L12 22L9.8 14.2L2 12L9.8 9.8L12 2Z"></path>
          </svg>
        </div>
        <div class="flex-1">
          <div class="flex items-center gap-1.5 mb-0.5">
            <span class="text-[11px] font-extrabold uppercase tracking-wider text-heather">MoodSync AI Tune</span>
            <span class="w-1.5 h-1.5 rounded-full bg-viridian inline-block"></span>
          </div>
          <p class="text-xs font-bold text-warmdark leading-snug">
            Suggested time based on your mood: <span class="text-heather font-extrabold underline decoration-candy decoration-2">4 PM</span>
          </p>
          <p class="text-[10.5px] font-semibold text-muteddark mt-0.5 leading-tight">
            Your afternoon energy shows calm focus, ideal for gentle replenishment.
          </p>
        </div>
      </div>

      <!-- Add Task Button (Solid Heather, Big and Rounded) -->
      <button type="button" class="w-full py-4 rounded-2xl bg-heather hover:bg-[#786689] active:scale-[0.98] transition-all text-white font-extrabold text-base tracking-wide flex items-center justify-center gap-2 shadow-raised mt-1">
        <svg class="w-5 h-5 stroke-white fill-none stroke-[3]" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
        </svg>
        <span class="">Add Task</span>
      </button>

    </div>
  </main>

  <!-- Floating Bottom Nav Bar (Solid Cream Pill with Raised Center Add (+) Icon) -->
  <div class="absolute bottom-5 left-0 right-0 px-6 z-30 flex justify-center pointer-events-none">
    <nav class="w-full max-w-[340px] bg-cream rounded-full px-4 shadow-nav flex items-center justify-between border border-[#FFF1E4] pointer-events-auto relative py-2.5">
      <!-- Home Tab -->
      <button class="flex flex-col items-center justify-center w-10 py-0.5 text-muteddark hover:text-warmdark transition-colors group">
        <svg class="w-5 h-5 fill-current group-hover:scale-110 transition-transform" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"></path></svg>
        <span class="text-[10px] font-bold mt-0.5">Home</span>
      </button>

      <!-- Companion / Nook Tab -->
      <button class="flex flex-col items-center justify-center w-10 py-0.5 text-muteddark hover:text-warmdark transition-colors group"><svg class="w-5 h-5 fill-current group-hover:scale-110 transition-transform" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"></path></svg><span class="text-[10px] font-bold mt-0.5">Chat</span></button>

      <!-- Active Raised Center Add (+) Tab -->
      <div class="flex flex-col items-center justify-center w-12 py-0.5 relative -mt-5"><button class="w-12 h-12 rounded-full bg-candy text-white flex items-center justify-center shadow-raised hover:scale-105 active:scale-95 transition-all -mb-1 -mt-2"><svg class="w-5 h-5 fill-current text-white" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 4a1.5 1.5 0 011.5 1.5V10.5H19.5a1.5 1.5 0 110 3H13.5V19.5a1.5 1.5 0 11-3 0V13.5H4.5a1.5 1.5 0 110-3H10.5V5.5A1.5 1.5 0 0112 4z" fill="currentColor"></path></svg></button><span class="text-[10px] font-extrabold text-candy mt-0.5">Add</span></div>

      <!-- Schedule / Log Tab -->
      <button class="flex flex-col items-center justify-center w-10 py-0.5 text-muteddark hover:text-warmdark transition-colors group"><svg class="w-5 h-5 fill-current group-hover:scale-110 transition-transform" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"></path></svg><span class="text-[10px] font-bold mt-0.5">Alerts</span></button>

      <!-- Profile Tab -->
      <button class="flex flex-col items-center justify-center w-10 py-0.5 text-muteddark hover:text-warmdark transition-colors group">
        <svg class="w-5 h-5 fill-current group-hover:scale-110 transition-transform" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path></svg>
        <span class="text-[10px] font-bold mt-0.5">Me</span>
      </button>
    </nav>
  </div>










</body></html>
